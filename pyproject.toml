[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-byzantine-state-arbiter"
version = "0.1.0"
description = "Byzantine fault-tolerant consensus state arbiter with quorum rounds and cryptographically verifiable state machine replication for agent clusters"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
swarm-byzantine-state-arbiter = "swarm_byzantine_state_arbiter.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["swarm_byzantine_state_arbiter*"]
